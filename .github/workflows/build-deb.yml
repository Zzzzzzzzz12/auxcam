name: build-deb

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: 鍙栦唬鐮?        uses: actions/checkout@v4

      - name: 瑁?roothide 鐗?Theos
        run: |
          git clone --recursive --depth 1 https://github.com/roothide/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH
          ls -1 $HOME/theos | head -20

      - name: 涓?iOS SDK
        run: |
          curl -L -o /tmp/sdks.zip https://github.com/theos/sdks/archive/master.zip
          unzip -q /tmp/sdks.zip -d /tmp
          mkdir -p $THEOS/sdks
          for s in iPhoneOS16.5.sdk iPhoneOS15.6.sdk iPhoneOS14.5.sdk; do
            cp -R /tmp/sdks-master/$s $THEOS/sdks/ 2>/dev/null && echo "鏀惧ソ $s" && break
          done
          ls -1 $THEOS/sdks || true

      - name: 鐜妫€鏌?        run: |
          echo "THEOS=$THEOS"
          for t in dpkg-deb ldid fakeroot make clang; do
            printf "%s -> %s\n" "$t" "$(which $t 2>/dev/null || echo 缂?"
          done
          ls -la tweak/ || true

      - name: 缂栬瘧锛坮oothide 瑙勬牸锛?        working-directory: tweak
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide

      - name: 鎵句骇鐗?        if: always()
        run: |
          ls -la tweak/packages/ 2>/dev/null || echo "(娌?packages)"
          find . -name "*.deb" 2>/dev/null || true

      - name: 涓婁紶 deb
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AuxCam-deb
          path: |
            tweak/packages/*.deb
            tweak/**/*.deb
          if-no-files-found: warn
