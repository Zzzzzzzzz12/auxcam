name: bd
on: [push, workflow_dispatch]
jobs:
  b:
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v4
    - uses: Randomblock1/theos-action@v1
    - name: build
      run: |
        cd tweak
        echo "TARGET = iphone:latest:15.0" > Makefile
        echo "include \$(THEOS)/makefiles/common.mk" >> Makefile
        echo "TWEAK_NAME = AuxCamTweak" >> Makefile
        echo "AuxCamTweak_FILES = Tweak.xm" >> Makefile
        echo "AuxCamTweak_CFLAGS = -fobjc-arc" >> Makefile
        echo "AuxCamTweak_FRAMEWORKS = UIKit Foundation AVFoundation AVKit CoreMedia CoreVideo" >> Makefile
        echo "include \$(THEOS_MAKE_PATH)/tweak.mk" >> Makefile
        cat Makefile
        make
        find . -name "*.dylib"
    - name: pack
      run: |
        cd tweak
        D=$(find . -name AuxCamTweak.dylib | head -1)
        echo "dylib=$D"
        rm -rf /tmp/p
        mkdir -p /tmp/p/Library/MobileSubstrate/DynamicLibraries
        mkdir -p /tmp/p/DEBIAN
        cp "$D" /tmp/p/Library/MobileSubstrate/DynamicLibraries/AuxCamTweak.dylib
        cp AuxCamTweak.plist /tmp/p/Library/MobileSubstrate/DynamicLibraries/AuxCamTweak.plist
        echo "Package: com.auxcam.tweak" > /tmp/p/DEBIAN/control
        echo "Name: AuxCam Tweak" >> /tmp/p/DEBIAN/control
        echo "Version: 1.0.0" >> /tmp/p/DEBIAN/control
        echo "Architecture: iphoneos-arm64" >> /tmp/p/DEBIAN/control
        echo "Description: AuxCam virtual camera" >> /tmp/p/DEBIAN/control
        echo "Maintainer: AuxCam" >> /tmp/p/DEBIAN/control
        echo "Author: AuxCam" >> /tmp/p/DEBIAN/control
        echo "Section: Tweaks" >> /tmp/p/DEBIAN/control
        mkdir -p packages
        dpkg-deb -b /tmp/p packages/AuxCamTweak.deb
        ls -la packages/
        dpkg-deb -c packages/AuxCamTweak.deb
    - uses: actions/upload-artifact@v4
      with:
        name: AuxCam-deb
        path: tweak/packages/*.deb
        if-no-files-found: warn
