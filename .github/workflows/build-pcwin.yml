name: bw
on: [push, workflow_dispatch]
jobs:
  b:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: build exe
      shell: pwsh
      run: |
        python -m pip install pyinstaller
        $ff = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
        Invoke-WebRequest $ff -OutFile ffmpeg.zip
        Expand-Archive ffmpeg.zip -DestinationPath ffx
        $exe = Get-ChildItem -Recurse ffx -Filter ffmpeg.exe | Select-Object -First 1
        New-Item -ItemType Directory -Force out | Out-Null
        Copy-Item $exe.FullName out\ffmpeg.exe
        python -m PyInstaller --onefile --windowed --name AuxCamPC `
          --add-data "pc-tools/sender_h264.py;." `
          --add-binary "out/ffmpeg.exe;." `
          --hidden-import plistlib --hidden-import xml.parsers.expat --hidden-import pyexpat `
          --hidden-import base64 --hidden-import random --hidden-import tempfile --hidden-import struct `
          pc-tools/win/AuxCamPC.py
        Remove-Item out\ffmpeg.exe
        Copy-Item dist\AuxCamPC.exe out\
        Copy-Item pc-tools\win\README_电脑端.txt out\
        Get-ChildItem out
    - uses: actions/upload-artifact@v4
      with:
        name: AuxCamPC-windows
        path: out
