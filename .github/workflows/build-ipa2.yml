name: ba2
on: [push, workflow_dispatch]
jobs:
  b:
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v4
    - name: build
      run: |
        cd ios-app
        rm -rf out
        mkdir -p out/Payload/AuxCam.app
        SDK=$(xcrun --sdk iphoneos --show-sdk-path)
        echo "SDK=$SDK"
        cp Info.template.plist out/Payload/AuxCam.app/Info.plist
        printf 'APPL????' > out/Payload/AuxCam.app/PkgInfo
        cp Icon-180.png out/Payload/AuxCam.app/Icon-180.png
        cp Icon-120.png out/Payload/AuxCam.app/Icon-120.png
        cp Icon-1024.png out/Payload/AuxCam.app/Icon-1024.png
        xcrun -sdk iphoneos swiftc -parse-as-library -O -target arm64-apple-ios17.0 -sdk "$SDK" \
          -o out/Payload/AuxCam.app/AuxCam AuxCam/AuxCamApp.swift \
          -framework SwiftUI -framework UIKit -framework AVKit -framework PhotosUI -framework CoreMedia -framework AVFoundation -framework VideoToolbox -framework IOSurface -framework VideoToolbox -framework IOSurface 2>&1 | tail -25
        chmod 755 out/Payload/AuxCam.app/AuxCam
        ls -la out/Payload/AuxCam.app
        cd out && ditto -c -k --keepParent Payload AuxCam.ipa
        ls -l AuxCam.ipa
    - uses: actions/upload-artifact@v4
      with:
        name: auxcamipa
        path: ios-app/out/AuxCam.ipa
