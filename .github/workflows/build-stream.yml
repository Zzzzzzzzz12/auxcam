name: bs
# 编译相机插件 AuxCamStream.dylib（只注入系统相机进程 applecamerad / cameracaptured，不注入任何 App）
on: [push, workflow_dispatch]
jobs:
  b:
    runs-on: macos-15-intel
    steps:
    - uses: actions/checkout@v4
    - uses: Randomblock1/theos-action@v1
    - name: build
      run: |
        set -e
        cd tweak-stream
        echo "TARGET = iphone:latest:15.0" > Makefile
        echo "ARCHS = arm64 arm64e" >> Makefile
        echo "include \$(THEOS)/makefiles/common.mk" >> Makefile
        echo "TWEAK_NAME = AuxCamStream" >> Makefile
        echo "AuxCamStream_FILES = Tweak.xm" >> Makefile
        echo "AuxCamStream_CFLAGS = -fobjc-arc -Wno-everything" >> Makefile
        echo "AuxCamStream_FRAMEWORKS = Foundation AVFoundation CoreMedia CoreVideo" >> Makefile
        echo "include \$(THEOS_MAKE_PATH)/tweak.mk" >> Makefile
        cat Makefile
        make 2>&1 | tail -60
        mkdir -p out
        D=$(find . -name AuxCamStream.dylib -not -path "./out/*" | head -1)
        echo "dylib=$D"
        test -n "$D"
        cp "$D" out/
        cp AuxCamStream.plist out/      # 注入范围：只有系统相机进程
        ls -l out
    - uses: actions/upload-artifact@v4
      with:
        name: auxcamstream
        path: tweak-stream/out/
