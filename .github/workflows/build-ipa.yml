name: build-ipa
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      - name: 取代码
        uses: actions/checkout@v4
      - name: 编译
        working-directory: ios-app
        run: |
          xcodebuild -project AuxCam.xcodeproj -scheme AuxCam -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CODE_SIGN_ENTITLEMENTS="" build
      - name: 打包 IPA
        working-directory: ios-app
        run: |
          ls -la build/Build/Products/Release-iphoneos/ || true
          rm -rf Payload AuxCam.ipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/AuxCam.app Payload/
          zip -qry AuxCam.ipa Payload
          ls -lh AuxCam.ipa
      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: AuxCam-ipa
          path: ios-app/AuxCam.ipa
          if-no-files-found: error
