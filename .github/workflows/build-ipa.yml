name: ba
on: [push, workflow_dispatch]
jobs:
  b:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v4
    - name: build
      run: |
        cd ios-app
        rm -rf out
        mkdir -p out/Payload/AuxCam.app
        SDK=$(xcrun --sdk iphoneos --show-sdk-path)
        echo "SDK=$SDK"
        cat > out/Payload/AuxCam.app/Info.plist <<'PLIST'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>CFBundleExecutable</key><string>AuxCam</string>
          <key>CFBundleIdentifier</key><string>com.auxcam.app</string>
          <key>CFBundleName</key><string>AuxCam</string>
          <key>CFBundleDisplayName</key><string>AuxCam</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleShortVersionString</key><string>1.0</string>
          <key>CFBundleVersion</key><string>1</string>
          <key>MinimumOSVersion</key><string>16.0</string>
          <key>UIDeviceFamily</key><array><integer>1</integer></array>
          <key>UILaunchScreen</key><dict/>
          <key>NSPhotoLibraryUsageDescription</key><string>需要从相册选择要作为相机画面的视频</string>
          <key>NSLocalNetworkUsageDescription</key><string>需要连接电脑上的直播流</string>
        </dict>
        </plist>
        PLIST
        printf 'APPL????' > out/Payload/AuxCam.app/PkgInfo
        xcrun -sdk iphoneos swiftc -parse-as-library -O -target arm64-apple-ios17.0 -sdk "$SDK" \
          -o out/Payload/AuxCam.app/AuxCam AuxCam/AuxCamApp.swift \
          -framework SwiftUI -framework UIKit -framework AVKit -framework PhotosUI -framework CoreMedia -framework AVFoundation 2>&1 | tail -25
        chmod 755 out/Payload/AuxCam.app/AuxCam
        ls -la out/Payload/AuxCam.app
        file out/Payload/AuxCam.app/AuxCam || true
        cd out && ditto -c -k --keepParent Payload AuxCam.ipa
        ls -l AuxCam.ipa
        unzip -l AuxCam.ipa
    - uses: actions/upload-artifact@v4
      with:
        name: auxcamipa
        path: ios-app/out/AuxCam.ipa
