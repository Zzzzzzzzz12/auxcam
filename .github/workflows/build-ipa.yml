name: build-ipa

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: 娉ㄥ叆鑷畨瑁呬唬鐮?        run: |
          cd ios-app
          printf '%s' '' | base64 -d > AuxCam/TweakInstaller.swift
          printf '%s' '' | base64 -d > /tmp/inject.py
          cd ..
          python3 /tmp/inject.py

      - name: 鏄剧ず Xcode 鐗堟湰
        run: xcodebuild -version

      - name: 缂栬瘧锛堜笉绛惧悕锛?        working-directory: ios-app
        run: |
          set -o pipefail
          xcodebuild -project AuxCam.xcodeproj -target AuxCam -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CODE_SIGN_ENTITLEMENTS="" build

      - name: 鎵撳寘鎴?IPA
        working-directory: ios-app
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP" ]; then echo "娌＄紪鍑?.app"; exit 1; fi
          echo "app = $APP"
          rm -rf Payload AuxCam.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry AuxCam.ipa Payload
          ls -lh AuxCam.ipa

      - name: 涓婁紶缁撴灉
        uses: actions/upload-artifact@v4
        with:
          name: AuxCam-ipa
          path: ios-app/AuxCam.ipa
          if-no-files-found: error
