name: ba
on: [push, workflow_dispatch]
jobs:
  b:
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v4
    - name: tools
      run: |
        brew install xcodegen || true
        xcodegen --version || true
    - name: build
      run: |
        cd ios-app
        xcodegen generate
        ls
        xcodebuild -project AuxCam.xcodeproj -scheme AuxCam -configuration Release \
          -sdk iphoneos -destination 'generic/platform=iOS' \
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
          -derivedDataPath build 2>&1 | tail -40
        APP=$(find build -name "AuxCam.app" -maxdepth 6 | head -1)
        echo "app=$APP"
        mkdir -p out/Payload
        cp -R "$APP" out/Payload/ || exit 1
        cd out && zip -qry AuxCam.ipa Payload && ls -l
    - uses: actions/upload-artifact@v4
      with:
        name: auxcamipa
        path: ios-app/out/AuxCam.ipa
