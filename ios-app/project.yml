name: AuxCam
options:
  bundleIdPrefix: com.auxcam
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_BITCODE: NO
    # 云端只出未签名包，回本地用 Sideloadly 签
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_ENTITLEMENTS: ""
    DEVELOPMENT_TEAM: ""

targets:
  AuxCam:
    type: application
    platform: iOS
    sources:
      - path: AuxCam
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.auxcam.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: AuxCam/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""

schemes:
  AuxCam:
    build:
      targets:
        AuxCam: all
    run:
      config: Release
    archive:
      config: Release
