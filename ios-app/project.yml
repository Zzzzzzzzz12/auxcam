name: AuxCam
options:
  bundleIdPrefix: com.auxcam
  deploymentTarget:
    iOS: "15.0"
targets:
  AuxCam:
    type: application
    platform: iOS
    sources:
      - path: AuxCam
    info:
      path: AuxCam/Info.plist
      properties:
        CFBundleDisplayName: AuxCam
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        NSPhotoLibraryUsageDescription: 需要从相册选择要作为相机画面的视频
        NSLocalNetworkUsageDescription: 需要连接电脑上的直播流
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.auxcam.app
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
